name: visual_math
description: 2D graphing and 3D geometry math models, editors, and rendering widgets.
version: 0.1.1
repository: https://github.com/JohnXu22786/visual-math
homepage: https://github.com/JohnXu22786/visual-math
license: AGPL-3.0-only

environment:
  sdk: '>=3.13.7 <4.0.0'
  flutter: '>=3.47.8'

dependencies:
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  flutter_math_fork: ^0.7.4
  idb_shim: ^2.6.5
  path_provider: ^2.1.5
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/vendor/mathlive/
    - assets/vendor/mathlive/fonts/
