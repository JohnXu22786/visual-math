name: Release Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to attach rebuilt example assets to
        required: true
        type: string
      rename_legacy_assets:
        description: Rename legacy example-* assets on the selected release
        required: false
        default: false
        type: boolean

concurrency:
  group: release-example-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-example:
    if: ${{ github.event_name == 'release' || !inputs.rename_legacy_assets }}
    uses: ./.github/workflows/build-example.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag }}

  upload-release-assets:
    name: Upload example builds to GitHub Release
    if: ${{ github.event_name == 'release' || !inputs.rename_legacy_assets }}
    needs: build-example
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: visual-math-*-release-*
          path: release-assets
          merge-multiple: true
      - name: Verify target release
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
      - name: Upload build assets
        run: gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY"
  rename-legacy-assets:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rename_legacy_assets }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Rename legacy release assets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.rename_legacy_assets }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          token = os.environ["GH_TOKEN"]
          api = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(url, data=None):
              body = json.dumps(data).encode() if data is not None else None
              req = urllib.request.Request(url, data=body, headers=headers, method="PATCH" if body else "GET")
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          release = request(f"{api}/releases/tags/{urllib.parse.quote(tag, safe='')}")
          assets = release["assets"]
          renames = {
              "example-android-apk.apk": f"visual-math-android-apk-release-{tag}.apk",
              "example-ios-unsigned.ipa": f"visual-math-ios-unsigned-release-{tag}.ipa",
              "example-linux-x64.zip": f"visual-math-linux-x64-release-{tag}.zip",
              "example-macos-arm64.zip": f"visual-math-macos-arm64-release-{tag}.zip",
              "example-macos-x64.zip": f"visual-math-macos-x64-release-{tag}.zip",
              "example-web.zip": f"visual-math-web-release-{tag}.zip",
              "example-windows-x64.zip": f"visual-math-windows-x64-release-{tag}.zip",
          }
          existing_names = {asset["name"] for asset in assets}
          planned = [
              (asset, renames[asset["name"]])
              for asset in assets
              if asset["name"] in renames
          ]
          planned_names = [new_name for _, new_name in planned]
          if len(planned_names) != len(set(planned_names)):
              raise SystemExit("Legacy asset rename mapping contains duplicate target names")
          for asset, new_name in planned:
              if new_name in existing_names:
                  raise SystemExit(f"Refusing to overwrite existing asset {new_name}")
          for asset, new_name in planned:
              request(f"{api}/releases/assets/{asset['id']}", {"name": new_name, "label": ""})
              print(f"Renamed {asset['name']} -> {new_name}")
          if not planned:
              print(f"No legacy example-* assets found on {tag}")
          PY
