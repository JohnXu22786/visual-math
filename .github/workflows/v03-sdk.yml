name: v0.3 SDK consumer

on:
  pull_request:
    branches: [v0.3]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true
      - name: Resolve consumer dependencies
        working-directory: examples/sdk_consumer
        run: flutter pub get
      - name: Analyze consumer
        working-directory: examples/sdk_consumer
        run: flutter analyze --fatal-warnings --fatal-infos
      - name: Test consumer
        working-directory: examples/sdk_consumer
        run: flutter test

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true
      - name: Resolve package dependencies
        run: flutter pub get
      - name: Resolve consumer dependencies for package analysis
        working-directory: examples/sdk_consumer
        run: flutter pub get
      - name: Analyze package
        run: flutter analyze --fatal-warnings --fatal-infos
      - name: Test package
        run: flutter test

  example-builds:
    uses: ./.github/workflows/build-example.yml
    with:
      ref: ${{ github.sha }}
