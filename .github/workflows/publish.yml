name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Signed release tag to publish
        required: true
        type: string

jobs:
  verify-version:
    name: Verify tag version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Validate tag trigger
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" != "tag" || "$INPUT_TAG" != "$REF_NAME" ]]; then
            echo "::error::Manual publishing must run on the selected tag ref; branch refs cannot authenticate with pub.dev Trusted Publishing."
            exit 1
          fi
      - name: Match tag to package version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref }}
        run: |
          tag_name="${RELEASE_TAG#refs/tags/}"
          tag_version="${tag_name#v}"
          package_version="$(awk '/^version:[[:space:]]*/ { sub(/^version:[[:space:]]*/, ""); print; exit }' pubspec.yaml)"
          # The -pub suffix is reserved for the one-time publication trigger tag.
          if [[ "$tag_version" == "${package_version}-pub" ]]; then
            tag_version="$package_version"
          fi

          if [[ ! "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$tag_name' is not a supported version tag."
            exit 1
          fi

          if [[ "$tag_version" != "$package_version" ]]; then
            echo "::error::Tag version '$tag_version' does not match pubspec.yaml version '$package_version'."
            exit 1
          fi

  publish:
    name: Publish to pub.dev
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1
      - uses: flutter-actions/setup-flutter@6e2468fd827c4a7337cd4b835a6049b78bc0bd1f
      - name: Install dependencies
        run: dart pub get
      - name: Publish dry run
        run: dart pub publish --dry-run --ignore-warnings
      - name: Publish to pub.dev
        run: dart pub publish -f
